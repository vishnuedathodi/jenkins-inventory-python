name: Jenkins Pipeline Inventory

on:
  # Run on-demand from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      max_workers:
        description: "Number of parallel threads (default: 20)"
        required: false
        default: "20"
      batch_size:
        description: "Jobs per batch (default: 500)"
        required: false
        default: "500"
      output_csv:
        description: "Output CSV filename"
        required: false
        default: "jenkins_pipeline_inventory.csv"

  # Optional: run on a schedule (every Monday at 06:00 UTC)
  schedule:
    - cron: "0 6 * * 1"

jobs:
  inventory:
    name: Collect Jenkins Pipeline Inventory
    runs-on: ubuntu-latest
    timeout-minutes: 360          # 6 h max for 100 k pipelines

    steps:
      # ── 1. Checkout repo ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ─────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Run inventory script ───────────────────────────────────────────
      - name: Run Jenkins inventory
        env:
          JENKINS_URL:    ${{ secrets.JENKINS_URL }}
          JENKINS_USER:   ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN:  ${{ secrets.JENKINS_TOKEN }}
          MAX_WORKERS:    ${{ github.event.inputs.max_workers || '20' }}
          BATCH_SIZE:     ${{ github.event.inputs.batch_size || '500' }}
          OUTPUT_CSV:     ${{ github.event.inputs.output_csv || 'jenkins_pipeline_inventory.csv' }}
          REQUEST_TIMEOUT: "30"
          RETRY_COUNT:     "3"
          BACKOFF_FACTOR:  "2.0"
          RATE_LIMIT_DELAY: "0.05"
        run: python jenkins_inventory.py

      # ── 5. Upload CSV as artifact ─────────────────────────────────────────
      - name: Upload inventory CSV
        if: always()          # upload even if some jobs failed
        uses: actions/upload-artifact@v4
        with:
          name: jenkins-inventory-${{ github.run_id }}
          path: |
            ${{ github.event.inputs.output_csv || 'jenkins_pipeline_inventory.csv' }}
            jenkins_inventory.log
          retention-days: 30

      # ── 6. (Optional) Commit CSV back to the repo ─────────────────────────
      # Uncomment the block below if you want the CSV committed automatically.
      #
      # - name: Commit inventory CSV to repository
      #   run: |
      #     git config user.name  "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     git add "*.csv" "*.log"
      #     git diff --cached --quiet || git commit -m "chore: update Jenkins inventory [skip ci]"
      #     git push
