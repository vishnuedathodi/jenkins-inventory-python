name: Jenkins Pipeline Inventory

on:
  # Trigger automatically on every push to the inventory feature branch
  push:
    branches:
      - feature/jenkins-inventory

  # Run on-demand from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      max_workers:
        description: "Number of parallel threads (default: 10)"
        required: false
        default: "10"
      batch_size:
        description: "Jobs per batch (default: 200)"
        required: false
        default: "200"
      output_csv:
        description: "Output CSV filename"
        required: false
        default: "jenkins_pipeline_inventory.csv"

  # Optional: run on a schedule (every Monday at 06:00 UTC)
  schedule:
    - cron: "0 6 * * 1"

jobs:
  inventory:
    name: Collect Jenkins Pipeline Inventory
    # Self-hosted runner group: cvs-linux-self-hosted
    # This runner must have network access to Jenkins.
    runs-on: [self-hosted, cvs-linux-self-hosted]
    timeout-minutes: 360          # 6 h max for 100 k pipelines

    steps:
      # ── 1. Checkout repo ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ─────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 3b. (Optional) Connect to corporate VPN via Tailscale ────────────
      # Uncomment this block if Jenkins is behind a private network and you
      # are using a GitHub-hosted runner (ubuntu-latest).
      # Requires TAILSCALE_AUTHKEY secret to be set.
      #
      # - name: Connect to Tailscale VPN
      #   uses: tailscale/github-action@v2
      #   with:
      #     authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      #     args: --accept-routes

      # ── 4. Run inventory script ───────────────────────────────────────────
      - name: Run Jenkins inventory
        env:
          JENKINS_URL:    ${{ secrets.JENKINS_URL }}
          JENKINS_USER:   ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN:  ${{ secrets.JENKINS_TOKEN }}
          # Set VERIFY_SSL=false as a secret if Jenkins uses a self-signed cert
          VERIFY_SSL:     ${{ secrets.VERIFY_SSL || 'true' }}
          MAX_WORKERS:    ${{ github.event.inputs.max_workers || '10' }}
          BATCH_SIZE:     ${{ github.event.inputs.batch_size || '200' }}
          OUTPUT_CSV:     ${{ github.event.inputs.output_csv || 'jenkins_pipeline_inventory.csv' }}
          CONNECT_TIMEOUT:  "15"
          READ_TIMEOUT:     "90"
          RETRY_COUNT:      "3"
          BACKOFF_FACTOR:   "2.0"
          RATE_LIMIT_DELAY: "0.1"
        run: python jenkins_inventory.py

      # ── 5. Upload CSV as artifact ─────────────────────────────────────────
      - name: Upload inventory CSV
        if: always()          # upload even if some jobs failed
        uses: actions/upload-artifact@v4
        with:
          name: jenkins-inventory-${{ github.run_id }}
          path: |
            ${{ github.event.inputs.output_csv || 'jenkins_pipeline_inventory.csv' }}
            jenkins_inventory.log
          retention-days: 30

      # ── 6. (Optional) Commit CSV back to the repo ─────────────────────────
      # Uncomment the block below if you want the CSV committed automatically.
      #
      # - name: Commit inventory CSV to repository
      #   run: |
      #     git config user.name  "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     git add "*.csv" "*.log"
      #     git diff --cached --quiet || git commit -m "chore: update Jenkins inventory [skip ci]"
      #     git push
